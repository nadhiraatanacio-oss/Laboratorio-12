services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mundial
      POSTGRES_USER: mundial
      POSTGRES_PASSWORD: mundial
    volumes:
      - datos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mundial -d mundial"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Tarea única: aplica migraciones y carga datos de prueba antes de levantar las réplicas
  migrar:
    build: ./web
    env_file: .env
    command: sh -c "python manage.py migrate --noinput && python manage.py cargar_demo"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    env_file: .env
    deploy:
      replicas: 3
    depends_on:
      migrar:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 5s
      timeout: 3s
      retries: 10

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy

volumes:
  datos-postgres:
